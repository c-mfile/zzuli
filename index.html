<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧党建引领校园网格治理平台</title>
  <style>
    :root {
      --primary: #1677ff;
      --ink: rgba(0, 0, 0, .88);
      --muted: rgba(0, 0, 0, .56);
      --line: #e6edf5;
      --page: #f5f7fb;
      --card: #fff;
      --shadow: 0 14px 34px rgba(20, 46, 86, .1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 12% 8%, #e6f4ff 0, transparent 32%), linear-gradient(135deg, #f7fbff 0%, var(--page) 58%, #fff7e6 100%);
    }
    .shell { min-height: 100vh; display: grid; place-items: center; padding: 48px 24px; }
    .portal { width: min(1080px, 100%); }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    .brand-mark {
      width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
      color: #fff; background: linear-gradient(135deg, #cf1322, #ff7875); font-size: 24px; font-weight: 700;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.25; letter-spacing: 0; }
    .subtitle { margin: 6px 0 0; color: var(--muted); }
    .entry-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .entry {
      min-height: 210px; padding: 24px; border: 1px solid var(--line); border-radius: 8px;
      background: rgba(255,255,255,.92); box-shadow: var(--shadow); text-decoration: none; color: inherit;
      display: flex; flex-direction: column; transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .entry:hover { transform: translateY(-3px); border-color: #91caff; box-shadow: 0 18px 42px rgba(22, 119, 255, .15); }
    .icon {
      width: 48px; height: 48px; border-radius: 8px; display: grid; place-items: center;
      color: #0958d9; background: #e6f4ff; font-size: 23px; margin-bottom: 22px;
    }
    .entry:nth-child(2) .icon { color: #389e0d; background: #f6ffed; }
    .entry:nth-child(3) .icon { color: #d46b08; background: #fff7e6; }
    .entry h2 { margin: 0; font-size: 19px; line-height: 1.4; letter-spacing: 0; }
    .entry p { margin: 8px 0 0; color: var(--muted); }
    .go { margin-top: auto; color: var(--primary); font-weight: 600; }
    @media (max-width: 820px) {
      .shell { place-items: start center; padding-top: 32px; }
      .entry-grid { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="portal">
      <header class="brand">
        <div class="brand-mark">党</div>
        <div>
          <h1>智慧党建引领校园网格治理平台</h1>
          <p class="subtitle">请选择要进入的端口</p>
        </div>
      </header>
      <section class="entry-grid" aria-label="系统入口">
        <a class="entry" href="backend.html">
          <span class="icon">管</span>
          <h2>管理后台</h2>
          <p>进入后台管理、基础配置、网格治理及业务流程管理。</p>
          <span class="go">进入 backend.html</span>
        </a>
        <a class="entry" href="student-app.html">
          <span class="icon">学</span>
          <h2>网格学生端</h2>
          <p>进入学生移动端，查看服务、上报事件、提交诉求。</p>
          <span class="go">进入 student-app.html</span>
        </a>
        <a class="entry" href="staff-app.html">
          <span class="icon">工</span>
          <h2>网格工作端</h2>
          <p>进入网格员工作端，处理巡查、事件、任务和反馈。</p>
          <span class="go">进入 staff-app.html</span>
        </a>
      </section>
    </div>
  </main>
</body>
</html>
