<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧党建引领校园网格治理平台 - 基础配置原型</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-hover: #4096ff;
      --primary-bg: #e6f4ff;
      --success: #52c41a;
      --warning: #faad14;
      --danger: #ff4d4f;
      --text: rgba(0, 0, 0, .88);
      --text-2: rgba(0, 0, 0, .65);
      --text-3: rgba(0, 0, 0, .45);
      --border: #d9d9d9;
      --split: #f0f0f0;
      --layout: #f5f5f5;
      --card: #fff;
      --radius: 6px;
      --shadow: 0 6px 16px 0 rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 14px/1.5715 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--layout);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app { min-width: 1180px; min-height: 100%; display: flex; }
    .sider {
      width: 248px; min-height: 100vh; position: fixed; inset: 0 auto 0 0;
      overflow-y: auto; background: #001529; color: rgba(255,255,255,.65); z-index: 10;
    }
    .brand {
      height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 18px;
      background: #002140; color: white; font-weight: 600; font-size: 15px;
      position: sticky; top: 0; z-index: 2;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(135deg, #ff7875, #cf1322); box-shadow: inset 0 0 0 2px rgba(255,255,255,.22);
      font-size: 18px;
    }
    .menu { padding: 10px 0 24px; }
    .menu-group-title {
      height: 42px; padding: 0 18px; display: flex; align-items: center; gap: 10px;
      color: rgba(255,255,255,.9); font-weight: 500; cursor: pointer;
    }
    .menu-group-title .chevron { margin-left: auto; transition: transform .2s; }
    .menu-group.collapsed .chevron { transform: rotate(-90deg); }
    .menu-group.collapsed .menu-children { display: none; }
    .menu-item {
      height: 40px; padding: 0 20px 0 48px; display: flex; align-items: center;
      cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .menu-item:hover { color: white; }
    .menu-item.active { color: white; background: var(--primary); }
    .menu-icon { width: 18px; text-align: center; font-size: 16px; }

    .main { width: calc(100% - 248px); margin-left: 248px; min-height: 100vh; }
    .header {
      height: 64px; position: sticky; top: 0; z-index: 8; background: #fff;
      border-bottom: 1px solid var(--split); display: flex; align-items: center; padding: 0 24px;
    }
    .header-left { display: flex; align-items: center; gap: 18px; }
    .header-title { font-size: 16px; font-weight: 600; }
    .env-tag { color: #0958d9; background: #e6f4ff; border: 1px solid #91caff; padding: 1px 7px; border-radius: 4px; font-size: 12px; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 18px; color: var(--text-2); }
    .header-action { cursor: pointer; position: relative; }
    .badge { position: absolute; top: -7px; right: -9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; color: white; background: var(--danger); font-size: 10px; line-height: 16px; text-align: center; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: white; display: inline-grid; place-items: center; margin-right: 6px; }

    .content { padding: 0 24px 32px; }
    .page-head { margin: 0 -24px 16px; padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--split); }
    .breadcrumb { color: var(--text-3); font-size: 13px; margin-bottom: 9px; }
    .breadcrumb span { color: var(--text-2); }
    .page-title-row { display: flex; align-items: flex-start; }
    h1 { font-size: 20px; line-height: 28px; margin: 0; }
    .page-desc { color: var(--text-2); margin-top: 4px; }
    .page-extra { margin-left: auto; display: flex; gap: 8px; }

    .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--split); margin-bottom: 16px; }
    .card-head { min-height: 54px; padding: 0 20px; border-bottom: 1px solid var(--split); display: flex; align-items: center; }
    .card-title { font-size: 16px; font-weight: 600; }
    .card-extra { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 20px; }

    .btn { height: 32px; padding: 4px 15px; border-radius: var(--radius); border: 1px solid var(--border); background: white; color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all .2s; }
    .btn:hover { color: var(--primary); border-color: var(--primary-hover); }
    .btn-primary { color: white; border-color: var(--primary); background: var(--primary); box-shadow: 0 2px 0 rgba(5,145,255,.1); }
    .btn-primary:hover { color: white; border-color: var(--primary-hover); background: var(--primary-hover); }
    .btn-danger { color: var(--danger); }
    .btn-link { border: 0; background: transparent; color: var(--primary); height: auto; padding: 2px 5px; }
    .btn-sm { height: 24px; padding: 0 9px; font-size: 12px; }

    .filter { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 16px 20px; }
    .field label { display: block; color: var(--text-2); margin-bottom: 5px; }
    .input, .select, .textarea { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); background: white; outline: 0; transition: all .2s; }
    .input, .select { height: 32px; padding: 4px 11px; }
    .textarea { min-height: 80px; resize: vertical; padding: 8px 11px; }
    .input:hover, .select:hover, .textarea:hover { border-color: var(--primary-hover); }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(5,145,255,.1); }
    .filter-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }

    .toolbar { display: flex; align-items: center; margin-bottom: 16px; gap: 8px; }
    .toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--text-3); }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { background: #fafafa; color: var(--text); text-align: left; font-weight: 600; padding: 12px 12px; border-bottom: 1px solid var(--split); }
    td { padding: 13px 12px; border-bottom: 1px solid var(--split); color: var(--text-2); vertical-align: middle; }
    tbody tr:hover td { background: #fafafa; }
    .check-col { width: 42px; text-align: center; }
    .code { font-family: "SFMono-Regular", Consolas, monospace; color: #0958d9; }
    .name-cell strong { color: var(--text); display: block; font-weight: 500; }
    .name-cell small { color: var(--text-3); }
    .tag { display: inline-block; border: 1px solid; padding: 0 7px; border-radius: 4px; line-height: 22px; font-size: 12px; white-space: nowrap; }
    .tag-green { color: #389e0d; background: #f6ffed; border-color: #b7eb8f; }
    .tag-gray { color: var(--text-2); background: #fafafa; border-color: var(--border); }
    .tag-blue { color: #0958d9; background: #e6f4ff; border-color: #91caff; }
    .tag-orange { color: #d46b08; background: #fff7e6; border-color: #ffd591; }
    .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; color: var(--text-2); }
    .page-num { min-width: 32px; height: 32px; border: 1px solid var(--border); border-radius: var(--radius); display: grid; place-items: center; background: white; }
    .page-num.active { border-color: var(--primary); color: var(--primary); }
    .tree-name { display: flex; align-items: center; min-height: 28px; color: var(--text); }
    .tree-toggle { width: 22px; height: 22px; padding: 0; border: 0; background: transparent; color: var(--text-3); display: inline-grid; place-items: center; }
    .tree-toggle:hover { color: var(--primary); }
    .tree-toggle.placeholder { visibility: hidden; }
    .tree-type-icon { width: 22px; height: 22px; margin: 0 7px 0 2px; border-radius: 4px; display: inline-grid; place-items: center; color: #0958d9; background: var(--primary-bg); font-size: 12px; }
    .student-table { min-width: 1420px; }
    .student-drawer { width: 780px; }
    .form-section { grid-column: 1 / -1; margin: 4px 0 -2px; padding: 0 0 9px; border-bottom: 1px solid var(--split); font-size: 15px; font-weight: 600; color: var(--text); }
    .form-section:not(:first-child) { margin-top: 14px; }
    .encrypted-tip { color: #d46b08; }

    .tree-node { height: 38px; padding: 0 10px; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .tree-node:hover { background: #f5f5f5; }
    .tree-node.selected { color: var(--primary); background: var(--primary-bg); }
    .tree-node.l2 { padding-left: 32px; }
    .tree-node.l3 { padding-left: 55px; }
    .tree-dot { width: 7px; height: 7px; border-radius: 50%; background: #bfbfbf; }
    .selected .tree-dot { background: var(--primary); }

    .grid-workbench { display: grid; grid-template-columns: 310px 1fr; gap: 16px; align-items: start; }
    .grid-tree-panel { min-height: 610px; }
    .tree-search { padding: 14px; border-bottom: 1px solid var(--split); }
    .tree-search-row { display: flex; gap: 6px; }
    .tree-search-row .input { flex: 1; min-width: 0; }
    .tree-scroll { padding: 10px 8px 18px; }
    .tree-count { margin-left: auto; color: var(--text-3); font-size: 12px; }
    .node-overview { padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 28px; border-bottom: 1px solid var(--split); }
    .info-label { color: var(--text-3); font-size: 13px; margin-bottom: 4px; }
    .info-value { color: var(--text); }
    .tabs { height: 46px; display: flex; align-items: flex-end; gap: 28px; padding: 0 20px; border-bottom: 1px solid var(--split); }
    .tab { height: 46px; padding-top: 13px; color: var(--text-2); cursor: pointer; position: relative; }
    .tab.active { color: var(--primary); }
    .tab.active:after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--primary); }
    .clickable-row { cursor: pointer; }
    .clickable-row.selected td { background: var(--primary-bg); }
    .muted { color: var(--text-3); }
    .alert { border: 1px solid #91caff; background: var(--primary-bg); border-radius: var(--radius); padding: 10px 14px; color: #0958d9; margin-bottom: 16px; }
    .flow-view { padding: 18px; overflow: auto; max-height: calc(100vh - 220px); background: linear-gradient(135deg,#f8fbff,#fffaf0); }
    .flow-view img { display: block; min-width: 1280px; width: 100%; height: auto; background: #fff; border: 1px solid #dbe3ef; border-radius: 4px; box-shadow: var(--shadow); }
    .flow-view img.flow-fit { min-width: 0; max-width: 860px; margin: 0 auto; }
    .drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; opacity: 0; visibility: hidden; transition: all .2s; }
    .drawer-mask.open { opacity: 1; visibility: visible; }
    .drawer { position: absolute; top: 0; right: 0; width: 520px; height: 100%; background: white; transform: translateX(100%); transition: transform .25s; display: flex; flex-direction: column; }
    .drawer-mask.open .drawer { transform: translateX(0); }
    .drawer-head { height: 56px; padding: 0 24px; display: flex; align-items: center; border-bottom: 1px solid var(--split); font-size: 16px; font-weight: 600; }
    .close { margin-left: auto; border: 0; background: transparent; font-size: 22px; color: var(--text-3); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
    .drawer-foot { height: 64px; border-top: 1px solid var(--split); display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .required:before { content: "*"; color: var(--danger); margin-right: 4px; }
    .help { color: var(--text-3); font-size: 12px; margin-top: 4px; }
    .switch { width: 44px; height: 22px; border-radius: 11px; border: 0; background: #bfbfbf; padding: 2px; transition: .2s; }
    .switch:before { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%; background: white; transition: .2s; }
    .switch.on { background: var(--primary); }
    .switch.on:before { transform: translateX(22px); }

    .toast { position: fixed; top: 24px; left: 50%; transform: translate(-50%, -20px); background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 16px; z-index: 99; opacity: 0; visibility: hidden; transition: .2s; }
    .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
    .toast b { color: var(--success); margin-right: 8px; }

    .empty { text-align: center; padding: 56px; color: var(--text-3); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sider">
      <div class="brand"><div class="brand-mark">党</div><span>智慧党建网格治理平台</span></div>
      <nav class="menu" id="sideMenu">
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">▦</span>基础主数据管理<span class="chevron">⌄</span></div>
          <div class="menu-children" id="masterMenu"></div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">▤</span>组织网格管理<span class="chevron">⌄</span></div>
          <div class="menu-children" id="orgGridMenu"></div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">◇</span>空间网格管理<span class="chevron">⌄</span></div>
          <div class="menu-children" id="spaceGridMenu"></div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">▤</span>责任清单<span class="chevron">⌄</span></div>
          <div class="menu-children" id="responsibilityMenu"></div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">✓</span>网格巡查管理<span class="chevron">⌄</span></div>
          <div class="menu-children" id="patrolMenu"></div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">△</span>事件管理<span class="chevron">⌄</span></div>
          <div class="menu-children" id="eventMenu"></div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">⚖</span>矛盾调解<span class="chevron">⌄</span></div>
          <div class="menu-children" id="mediationMenu"></div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">◈</span>服务管理<span class="chevron">⌄</span></div>
          <div class="menu-children" id="serviceMenu"></div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">△</span>任务交办管理<span class="chevron">⌄</span></div>
          <div class="menu-children" id="assignmentMenu"></div>
        </div>
        <div class="menu-group">
          <div class="menu-group-title"><span class="menu-icon">△</span>任务交办管理<span class="chevron">⌄</span></div>
          <div class="menu-children" id="facilityMenu"></div>
        </div>
      </nav>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left"><span style="font-size:18px">☰</span><span class="header-title">智慧党建引领校园网格治理平台</span><span class="env-tag">原型环境</span></div>
        <div class="header-actions">
          <span class="header-action">帮助</span>
          <span class="header-action">消息<span class="badge">6</span></span>
          <span><i class="avatar">管</i>系统管理员 ▾</span>
        </div>
      </header>
      <div class="content" id="page"></div>
    </main>
  </div>

  <div class="drawer-mask" id="drawerMask" aria-hidden="true">
    <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-head"><span id="drawerTitle">新增数据</span><button class="close" data-action="close-drawer" aria-label="关闭">×</button></div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot"><button class="btn" data-action="close-drawer">取消</button><button class="btn btn-primary" data-action="save">保存</button></div>
    </section>
  </div>

  <div class="toast" id="toast"><b>✓</b><span>操作成功</span></div>

  <script>
    const masterModules = [
      { id:'org', name:'行政组织', title:'行政组织架构管理', desc:'维护学校真实行政组织主数据，是组织网格生成的数据来源。' },
      { id:'party', name:'党组织', title:'党组织架构管理', desc:'维护党组织及党员归属，为党组织覆盖网格和党员下沉服务提供来源。' },
      { id:'member', name:'党员信息', title:'党员信息管理', desc:'维护党员身份、组织关系、党籍状态和党内职务，为党员下沉网格服务提供基础。' },
      { id:'pioneer', name:'先锋岗位', title:'先锋岗位管理', desc:'统一维护党员先锋岗、党员责任区、党员宿舍和党员导师等岗位定义、覆盖范围与岗位职责。' },
      { id:'staff', name:'教职工信息', title:'教职工信息管理', desc:'维护教职工工号、姓名、职务、岗位和所属单位等基础信息，为网格责任人员配置提供来源。' },
      { id:'student', name:'学生信息', title:'学生基础信息', desc:'形成全校统一学生主档，学生作为治理对象关联两类网格。' },
      { id:'space', name:'空间目录', title:'社区空间目录管理', desc:'维护社区、楼栋、楼层、宿舍和床位的权威空间目录。' },
      { id:'facility', name:'设施点位', title:'公共设施与服务点位', desc:'管理门禁、消防、维修设施和公共服务点位。' },
      { id:'facility-type', name:'设施点位类型管理', title:'设施点位类型管理', desc:'维护设施分类、默认责任部门、适用空间层级、二维码规则和启停状态。' }
    ];
    const orgGridModules = [
      { id:'og-tree', name:'网格树', title:'组织网格树管理', desc:'学校、学院等上层网格各配置1名网格长管理下级；班级末级网格各配置1名网格员负责本格。' }
    ];
    const spaceGridModules = [
      { id:'sg-tree', name:'网格树', title:'空间网格树管理', desc:'社区、楼栋、楼层等上层网格各配置1名网格长管理下级；宿舍末级网格各配置1名网格员负责本格。' }
    ];
    const repairModules = [
      { id:'repair-record', name:'维修记录', title:'设施维修记录', desc:'查看扫码报修、维修接单、预约到场、处理结果和申请人确认的全过程记录。' },
      { id:'repair-flow', name:'设施报修流程', title:'设施报修流程', desc:'展示设施二维码配置、学生扫码报修、负责人处理与学生确认的维修闭环。' }
    ];
    const responsibilityModules = [
      { id:'resp-duty', name:'责任清单管理', title:'网格责任清单管理', desc:'新增、上传和维护网格责任清单文档，支持 Word、PDF 等文件及版本管理。' },
      { id:'resp-duty-issue', name:'责任清单下发', title:'网格责任清单下发', desc:'选择责任清单和目标网格，下发给对应网格员查看并跟踪阅读状态。' }
    ];
    const assignmentModules = [
      { id:'task-ledger', name:'任务台账', title:'任务交办台账', desc:'统一创建、按组织或网格下发任务，查看接收、执行和完成进度。' },
      { id:'task-template', name:'专项任务模板', title:'专项任务模板', desc:'维护安全检查、学风督查、宿舍走访、卫生检查和消防排查等常用模板。' },
      { id:'task-review', name:'结果审核', title:'任务结果审核', desc:'审核执行人提交的进度、问题、材料和完成说明，办结或退回修改。' },
      { id:'task-flow', name:'任务交办流程', title:'任务交办流程', desc:'展示后台创建、下发、审核与网格员接收、执行、提交、修改的任务闭环。' }
    ];
    const patrolModules = [
      { id:'patrol-standard', name:'巡查事项库', title:'巡查事项库', desc:'统一维护校园网格巡查事项、检查项及每项对应的检查要求、问题等级和处置标准。' },

    document.addEventListener('click', e => {
      const action = e.target.closest('[data-action]')?.dataset.action; if (!action) return;
      const actionEl=e.target.closest('[data-action]');
      if (action==='toggle-org-node') { const id=actionEl.dataset.node; orgTreeUI.expanded.has(id)?orgTreeUI.expanded.delete(id):orgTreeUI.expanded.add(id); render(); }
      if (action==='select-org-node') { orgTreeUI.selected=actionEl.dataset.node; orgNodeAncestors(getOrgNode(orgTreeUI.selected)).forEach(id=>orgTreeUI.expanded.add(id)); render(); }
      if (action==='expand-org-tree') { orgTreeNodes.filter(n=>orgTreeNodes.some(x=>x.parent===n.id)).forEach(n=>orgTreeUI.expanded.add(n.id)); render(); }
      if (action==='collapse-org-tree') { orgTreeUI.expanded.clear(); orgTreeUI.expanded.add('school'); render(); }
      if (action==='search-org-tree') { orgTreeUI.search=document.getElementById('orgTreeSearch').value.trim(); render(); }
      if (action==='reset-org-tree') { orgTreeUI.search=''; render(); }
      if (action==='org-tree-tab') { orgTreeUI.tab=actionEl.dataset.tab; render(); }
      if (action==='add-org-node') openOrgNodeDrawer('add',orgTreeUI.selected);
      if (action==='view-org-node') openOrgNodeDrawer('view',actionEl.dataset.node||orgTreeUI.selected);
      if (action==='edit-org-node') openOrgNodeDrawer('edit',actionEl.dataset.node||orgTreeUI.selected);
      if (action==='view-org-student') studentDrawerForm({id:'student'},true);
      if (action==='add-org-team' || action==='edit-org-team') openOrgAuxDrawer('team');
      if (action==='add-org-relation' || action==='edit-org-relation') openOrgAuxDrawer('relation');
      if (action==='disable-org-node') toast('已进入停用校验，需完成事项承接后生效');
