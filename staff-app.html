  </main>`;
  const checklistData=[
    {id:'QD-01',title:'学生社区楼栋巡查责任清单 V1.0',type:'PDF',grid:'科学校区一号楼',deadline:'7月10日前查看',status:'待查看'},
    {id:'QD-02',title:'空间网格员工作责任清单 V1.3',type:'Word',grid:'一号楼三层',deadline:'7月1日已确认',status:'已查看'}
  ];
  const cats={events:'事件',patrols:'巡查',mediations:'调解',assignments:'交办',repairs:'维修'};
  function catClass(c){return c==='事件'?'red':c==='交办'?'orange':''}
  const tagList=t=>(t.tags||[]).map(x=>`<span class="tag ${catClass(t.cat)}">${x}</span>`).join('');
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toastEl.classList.remove('show'),1700)}
  function header(title){return `<div class="sub-head"><button class="back" data-action="back" aria-label="返回"></button><h1>${title}</h1><button class="head-action"></button></div>`}
  function go(next,item=null,push=true){if(push&&route!=='home')historyStack.push(route);else if(push&&route==='home')historyStack=['home'];route=next;current=item;filter='全部';render()}
  function back(){if(route==='home'){if(window.history.length>1)window.history.back();return}const next=historyStack.pop()||'home';route=next;filter='全部';render()}
  function card(t){
    const title=`<div class="item-title">${t.title}</div>`;
    const meta=`<div class="item-meta"><span>所属网格：${t.grid}</span><span>上报时间：${t.reportTime}</span></div>`;
    const top=`<div class="item-top">${tagList(t)||`<span class="tag ${catClass(t.cat)}">${t.cat}</span>`}<span class="item-state">${t.status}</span></div>`;
    const repairAction=t.cat==='维修'?`<div class="actions"><button class="btn ${t.status==='待接单'?'btn-primary':''}" data-action="${t.status==='待接单'?'accept':'execute'}" data-id="${t.id}">${t.status==='待接单'?'接单':'维修处理'}</button></div>`:'';
    return `<div class="list-item" data-action="open-item" data-id="${t.id}">${top}${title}${meta}${repairAction}</div>`;
  }
  function listPage(cat,title){
    let source=cat==='全部'?tasks:tasks.filter(x=>x.cat===cat);
    let options=cat==='全部'?['全部','事件','巡查','调解','交办','维修']:['全部','待处理','执行中','已完成'];
    if(filter!=='全部'){
      source=options.includes(filter)&&['事件','巡查','调解','交办','维修'].includes(filter)
        ?source.filter(x=>x.cat===filter)
        :source.filter(x=>filter==='待处理'?/待/.test(x.status):filter==='执行中'?/执行|处理|接单|预约|调解/.test(x.status):/完成|办结|评价/.test(x.status));
    }
    return `${header(title)}<main class="sub-main"><div class="filter">${options.map(x=>`<button class="pill ${filter===x?'active':''}" data-action="filter" data-filter="${x}">${x}</button>`).join('')}</div><div class="card">${source.length?source.map(card).join(''):'<div class="empty">暂无该状态任务</div>'}</div></main>`;
  }
  function detailRows(t){
    const rows=[
      ['责任网格',t.grid],
      ['上报时间',t.reportTime],
      ['处理期限',t.deadline]
    ];
    if(t.cat==='事件')rows.push(['处理角色',t.role]);
    else if(t.cat==='调解')rows.push(['当事人',t.parties]);
    else if(t.cat==='维修')rows.push(['报修资产',t.asset]);
    else rows.push(['下发/联系人',t.source]);
    return rows.map(([k,v])=>`<div class="info-row"><span class="info-label">${k}</span><span class="info-value">${v||'—'}</span></div>`).join('');
  }
  function eventFlow(t){
    if(t.cat!=='事件')return '';
    const evaluation=t.status==='已评价'&&t.evaluation?`<div class="form-card"><b>评价内容</b><div class="info-row"><span class="info-label">得分</span><span class="info-value">${t.evaluation.score}分</span></div><div class="info-row"><span class="info-label">评语</span><span class="info-value">${t.evaluation.comment}</span></div></div>`:'';
    const records=[...(t.flowRecords||[])].sort((a,b)=>b.time.localeCompare(a.time));
    return `${evaluation}<div class="form-card"><b>流转记录</b><div class="timeline" style="margin-top:15px">${records.map(x=>`<div class="timeline-item">${x.content}<div class="timeline-time">${x.person} · ${x.time}</div></div>`).join('')}</div></div>`;
  }
  function detail(t){
    const btn=t.cat==='事件'
      ?(t.status==='已评价'?'':(t.status==='待接单'?'<button class="btn btn-primary" data-action="accept">接单并处理</button>':'<button class="btn btn-primary" data-action="execute">进入事件处理</button>'))
      :t.cat==='维修'
        ?`<button class="btn btn-primary" data-action="${t.status==='待接单'?'accept':'execute'}">${t.status==='待接单'?'接单':'维修处理'}</button>`
        :t.cat==='交办'
          ?(t.status==='待接收'?'<button class="btn btn-primary" data-action="accept">确认接收</button>':'<button class="btn btn-primary" data-action="execute">继续执行</button>')
          :t.cat==='调解'
            ?'<button class="btn btn-primary" data-action="execute">填写调解记录</button>'
            :'<button class="btn btn-primary" data-action="execute">'+(signed?'继续巡查':'签到并开始巡查')+'</button>';
    return `${header(t.cat+'任务详情')}<main class="sub-main"><div class="card card-pad"><div class="item-top">${tagList(t)||`<span class="tag ${catClass(t.cat)}">${t.cat}</span>`}<span class="item-state">${t.status}</span></div><h2 style="font-size:18px;margin:13px 0 6px">${t.title}</h2><div class="item-meta">${t.id}</div></div><div class="info">${detailRows(t)}</div><div class="card card-pad"><b>${t.cat==='事件'?'事件描述':'任务说明'}</b><p style="color:#66758a;font-size:14px;line-height:1.75;margin-bottom:0">${t.desc}</p></div>${eventFlow(t)}<div class="actions">${t.cat==='事件'&&t.status!=='已评价'?'<button class="btn btn-danger" data-action="transfer">无法处理</button>':''}${btn}</div></main>`;
  }
  function responsibility(){return `${header('我的责任网格')}<main class="sub-main"><div class="card card-pad"><div class="item-top"><span class="tag">当前网格</span><span class="item-state" style="color:#38a946">履职中</span></div><h2 style="font-size:19px;margin:13px 0 5px">xx社区-2号楼-1层-102</h2><p style="margin:0;color:#8792a4;font-size:13px">空间网格员：刘老师</p></div><div class="card grid-tree"><div class="grid-node"><span class="grid-level">校</span><div><b>科学校区</b><div class="item-meta">校区网格</div></div></div><div class="grid-node"><span class="grid-level">楼</span><div><b>一号楼</b><div class="item-meta">楼栋网格长：李老师</div></div></div><div class="grid-node"><span class="grid-level">层</span><div><b>一号楼三层</b><div class="item-meta">楼层网格长：刘老师</div></div></div><div class="grid-node current"><span class="grid-level">室</span><div><b>xx社区-2号楼-1层-102</b><div class="item-meta">24名成员 · 8项责任 · 当前网格</div></div></div></div><div class="info"><div class="info-row"><span class="info-label">网格类型</span><span class="info-value">空间网格 / 宿舍</span></div><div class="info-row"><span class="info-label">上级网格</span><span class="info-value">一号楼三层</span></div><div class="info-row"><span class="info-label">责任电话</span><span class="info-value">0371-8660****</span></div></div><button class="btn btn-primary btn-block" data-action="switch-grid">切换责任网格</button></main>`}
  function checklists(){return `${header('我的责任清单')}<main class="sub-main"><div class="tip">责任清单由上级网格下发，查看后将自动记录确认时间。</div><div class="card">${checklistData.map(x=>`<div class="list-item" data-action="open-checklist" data-id="${x.id}"><div class="item-top"><span class="tag">${x.type}</span><span class="item-state" style="${x.status==='已查看'?'color:#38a946':''}">${x.status}</span></div><div class="item-title">${x.title}</div><div class="item-meta"><span>下发网格：${x.grid}</span><span>${x.deadline}</span></div></div>`).join('')}</div></main>`}
  function checklistDetail(x){return `${header('责任清单详情')}<main class="sub-main"><div class="card card-pad"><span class="tag">${x.type}</span><h2 style="font-size:18px;line-height:1.5">${x.title}</h2><div class="item-meta">版本号 V1.0 · 下发网格：${x.grid}</div></div><div class="form-card"><b>主要责任事项</b><div class="timeline" style="margin-top:15px"><div class="timeline-item">每日完成责任区域安全巡查<div class="timeline-time">发现问题及时上报并跟踪闭环</div></div><div class="timeline-item">定期联系网格内重点人员<div class="timeline-time">记录诉求、风险和帮扶情况</div></div><div class="timeline-item">接收并处理网格事件<div class="timeline-time">超出权限的事项按层级流转</div></div><div class="timeline-item">按要求完成交办任务<div class="timeline-time">全过程留痕，结果可追溯</div></div></div></div><button class="btn btn-primary btn-block" data-action="confirm-checklist">${x.status==='已查看'?'已查看（再次预览）':'已阅读并确认'}</button></main>`}
  function patrolExecute(){return `${header('移动巡查')}<main class="sub-main"><div class="tip ${signed?'':'warn'}">${signed?'已完成定位签到：一号楼三层':'请在责任网格现场完成定位签到后开始检查。'}</div>${signed?'':`<button class="btn btn-primary btn-block" data-action="checkin" style="margin-bottom:12px">定位签到</button>`}<div class="card">${['消防通道保持畅通','消防器材状态正常','公共区域卫生整洁','门窗与用电设施安全'].map((x,i)=>`<div class="check"><b>${i+1}. ${x}</b><p>${i===0?'不得堆放纸箱、桌椅等影响通行的物品':'现场核对责任清单标准并留痕'}</p><div class="segments"><button class="${checks[i]==='ok'?'active ok':''}" data-action="set-check" data-index="${i}" data-value="ok">正常</button><button class="${checks[i]==='bad'?'active bad':''}" data-action="set-check" data-index="${i}" data-value="bad">异常</button></div>${checks[i]==='bad'?'<div class="upload" data-action="upload" style="margin-top:10px">＋ 添加异常照片和说明</div>':''}</div>`).join('')}</div><div class="actions"><button class="btn btn-primary" data-action="submit">提交巡查记录</button></div></main>`}
  function execute(t){
    if(t.cat==='巡查')return patrolExecute(t);
    let body='';
    if(t.cat==='事件')body=`<div class="field"><label>当前节点</label><input class="input" readonly value="${t.grid}｜${t.role}"></div><div class="field"><label class="required">现场核实结果</label><textarea class="textarea" required>${t.desc}</textarea></div><div class="field"><label class="required">处理措施</label><textarea class="textarea" required placeholder="说明已采取的措施和处理结果"></textarea></div><div class="field"><label>办结方式</label><select class="select"><option>现场处理并办结</option><option>持续跟进</option><option>需要上级协同</option></select></div>`;
    if(t.cat==='调解')body=`<div class="field"><label>案件</label><input class="input" readonly value="${t.id}｜${t.title}"></div><div class="field"><label class="required">调解时间</label><input class="input" type="datetime-local" value="2026-07-08T15:00"></div><div class="field"><label class="required">地点/方式</label><select class="select"><option>学生社区会谈室2</option><option>线上视频</option><option>综合楼A203</option></select></div><div class="field"><label>到场情况</label><select class="select"><option>待确认</option><option>全部到场</option><option>部分到场</option></select></div><div class="field"><label class="required">调解过程</label><textarea class="textarea" required placeholder="记录当事人陈述、争议焦点、调解建议与阶段共识"></textarea></div><div class="field"><label>阶段结果</label><select class="select"><option>继续调解</option><option>达成一致</option><option>调解不成</option></select></div>`;
    if(t.cat==='交办')body=`<div class="field"><label class="required">过程反馈</label><textarea class="textarea" required placeholder="填写执行情况、发现问题和完成结果"></textarea></div><div class="field"><label>需协调事项</label><textarea class="textarea" placeholder="如有困难请说明"></textarea></div>`;
    if(t.cat==='维修')body=`<div class="field"><label class="required">故障核实</label><textarea class="textarea" required>${t.desc}</textarea></div><div class="field"><label class="required">维修处理结果</label><textarea class="textarea" required placeholder="说明维修措施、更换部件和处理结果"></textarea></div>`;
    const title=t.cat==='调解'?'填写调解记录':t.cat+'任务处理';
    const submitText=t.cat==='维修'?'提交结果':'提交处理结果';
    return `${header(title)}<main class="sub-main"><div class="form-card">${body}<div class="field"><label>现场材料</label><div class="upload" data-action="upload">＋ 拍照、视频、语音或附件<br><span>已添加 ${photos} 项</span></div></div></div><div class="actions"><button class="btn btn-primary" data-action="submit">${submitText}</button></div></main>`;
  }
  function switchGrid(){document.getElementById('sheetTitle').textContent='切换责任网格';document.getElementById('sheetBody').innerHTML=`<div class="card"><div class="list-item" data-action="choose-grid" data-grid="xx社区-2号楼-1层-102"><div class="item-title">xx社区-2号楼-1层-102</div><div class="item-meta">空间网格员 · 当前网格</div></div><div class="list-item" data-action="choose-grid" data-grid="软件工程2401班"><div class="item-title">软件工程2401班</div><div class="item-meta">组织网格员</div></div><div class="list-item" data-action="choose-grid" data-grid="一号楼三层"><div class="item-title">一号楼三层</div><div class="item-meta">楼层网格长</div></div></div>`;sheet.classList.add('open')}
  function transfer(){document.getElementById('sheetTitle').textContent='无法处理 / 继续流转';document.getElementById('sheetBody').innerHTML=`<div class="tip warn">事件将按空间网格层级流转，当前操作记录会完整保留。</div><div class="form-card"><div class="field"><label class="required">流转方式</label><select class="select"><option>上报至上级网格长</option><option>下发至其他网格（网格长专用）</option></select></div><div class="field"><label class="required">目标节点</label><select class="select"><option>${current.next}</option></select></div><div class="field"><label class="required">无法处理原因</label><select class="select"><option>超出当前网格处置能力</option><option>需要上级统筹协调</option><option>需要跨网格处理</option></select></div><div class="field"><label class="required">现场核实与流转说明</label><textarea class="textarea" placeholder="说明现场情况、已采取措施及继续流转原因"></textarea></div><div class="upload" data-action="upload">＋ 添加现场材料</div></div><button class="btn btn-primary btn-block" data-action="confirm-transfer">确认流转至目标网格</button>`;sheet.classList.add('open')}
  function render(){window.scrollTo(0,0);if(route==='home'){screen.innerHTML=homeHTML;return}if(route==='responsibility')screen.innerHTML=`<div class="subpage">${responsibility()}</div>`;else if(route==='checklists')screen.innerHTML=`<div class="subpage">${checklists()}</div>`;else if(route==='checklistDetail')screen.innerHTML=`<div class="subpage">${checklistDetail(current)}</div>`;else if(route==='all')screen.innerHTML=`<div class="subpage">${listPage('全部','全部待办')}</div>`;else if(cats[route])screen.innerHTML=`<div class="subpage">${listPage(cats[route],cats[route]+'任务')}</div>`;else if(route==='detail')screen.innerHTML=`<div class="subpage">${detail(current)}</div>`;else if(route==='execute')screen.innerHTML=`<div class="subpage">${execute(current)}</div>`}
  render();
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action],[data-name]');if(!el)return;
    const a=el.dataset.action,name=el.dataset.name,id=el.dataset.id;
    if(id)current=tasks.find(x=>x.id===id)||current;
    if(name){e.preventDefault();const map={'责任网格':'responsibility','责任清单':'checklists','事件任务':'events','巡查任务':'patrols','调解任务':'mediations','交办任务':'assignments','维修任务':'repairs','全部待办':'all'};if(map[name])return go(map[name]);const t=tasks.find(x=>x.title===name);if(t)return go('detail',t);if(name==='切换网格')return switchGrid()}
    if(a==='back')back();
    if(a==='filter'){filter=el.dataset.filter;render()}
    if(a==='open-item')go('detail',current);
    if(a==='open-checklist')go('checklistDetail',checklistData.find(x=>x.id===el.dataset.id));
    if(a==='confirm-checklist'){current.status='已查看';toast('责任清单已确认，查看记录已保存');render()}
    if(a==='switch-grid')switchGrid();
    if(a==='close-sheet')sheet.classList.remove('open');
    if(a==='choose-grid'){sheet.classList.remove('open');document.querySelector('.profile p:last-of-type')?.replaceChildren(el.dataset.grid);toast('已切换至 '+el.dataset.grid)}
    if(a==='accept'){current.status=current.cat==='维修'?'已接单':'处理中';toast(current.cat==='维修'?'接单成功':'接收成功，任务已进入处理中');current.cat==='维修'?render():setTimeout(()=>go('execute',current,false),450)}
    if(a==='execute')go('execute',current);
    if(a==='transfer')transfer();
    if(a==='confirm-transfer'){sheet.classList.remove('open');current.status='已流转上级';current.flowRecords=[{content:'无法处理，已流转至上级网格长。',person:'刘老师',time:'2026-07-07 10:30'},...(current.flowRecords||[])];toast('已按网格层级流转');setTimeout(()=>back(),500)}
    if(a==='checkin'){signed=true;toast('签到成功，定位有效');render()}
    if(a==='set-check'){checks[Number(el.dataset.index)]=el.dataset.value;render()}
    if(a==='upload'){photos++;el.innerHTML=`已添加现场材料<br><span>共 ${photos} 项，点击继续添加</span>`;toast('现场材料已添加')}
    if(a==='submit'){const missing=[...screen.querySelectorAll('[required]')].some(x=>!x.value.trim());if(missing)return toast('请先填写全部必填项');if(current.cat==='巡查'&&(!signed||checks.some(x=>!x)))return toast(!signed?'请先完成现场签到':'请完成全部检查项');current.status=current.cat==='调解'?'调解中':'已处理';toast('提交成功，处理记录已同步');setTimeout(()=>{route=cats[Object.keys(cats).find(k=>cats[k]===current.cat)]?Object.keys(cats).find(k=>cats[k]===current.cat):'all';historyStack=['home'];render()},650)}
  });
  sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('open')});
</script>
</body>
</html>
